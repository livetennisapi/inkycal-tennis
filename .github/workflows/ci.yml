name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Inkycal main pins numpy~=2.5.0, which needs Python >= 3.12
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Inkycal (editable, so packaged fonts are available)
        run: |
          git clone --depth 1 https://github.com/aceinnolab/Inkycal /tmp/Inkycal
          pip install -e /tmp/Inkycal
          pip install pytest
      - name: Run tests (API fully mocked, no key needed)
        run: pytest tests/ -v
      - name: Render preview from mocked data
        run: python tests/render_preview.py
